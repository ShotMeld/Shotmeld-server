name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v4 # 拉取你的仓库代码到 Actions 运行器

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3 # 使用 appleboy/ssh-action
        with:
          host: ${{ secrets.SERVER_HOST }} # 从 GitHub Secrets 读取服务器 IP
          username: ${{ secrets.SERVER_USERNAME }} # 从 GitHub Secrets 读取 SSH 用户名
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }} # 从 GitHub Secrets 读取 SSH 私钥
          port: ${{ 22 }} # 从 GitHub Secrets 读取 SSH 端口，如果未设置则默认为 22
          script: | # 在你的服务器上执行的脚本
            echo "Connecting to server ${{ secrets.SERVER_HOST }} as ${{ secrets.SERVER_USERNAME }}"
            echo "Navigating to project directory..."
            cd /root/projects/Shotmeld-server  # <--- 这里已更新为你的项目路径
            
            echo "Pulling latest changes from master branch..."
            git checkout master # 确保在 master 分支
            git fetch origin master # 获取最新的 master 分支信息
            git reset --hard origin/master # 强制将本地分支重置为远程 master 分支的状态
            # git pull origin master # 通常在 reset --hard 后，此命令可以省略或作为双重检查
            
            echo "Reloading application with PM2..."
            export NVM_DIR="$HOME/.nvm" # 指定 NVM 的安装目录
            if [ -s "$NVM_DIR/nvm.sh" ]; then # 检查 NVM 脚本是否存在
              source "$NVM_DIR/nvm.sh"  # 加载 NVM
              # 如果你的 pm2 需要特定版本的 Node.js, 你可能需要在这里添加:
              # nvm use default  # 或者 nvm use <your_node_version>
            else
              echo "Warning: NVM script not found at $NVM_DIR/nvm.sh. Trying to source .bashrc as a fallback." >&2
              if [ -s "$HOME/.bashrc" ]; then # 如果 NVM 脚本未找到，尝试加载 .bashrc
                source "$HOME/.bashrc"
              else
                echo "Warning: .bashrc not found. pm2 might still not be found." >&2
            fi
            pm2 reload ecosystem.config.js # 使用 PM2 重载应用

            echo "Deployment to server completed successfully at $(date)"